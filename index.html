<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100d33">
<meta name="description" content="Crousti Empire : fais grandir ton resto de poulet croustillant en résolvant des grilles.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Crousti Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Palette: night indigo with hot-pink and electric-blue light. Layout: compact HUD on top, one scrolling home (level, map, upgrade tiles, play list); puzzles open as a full-screen sheet. */
:root{
  --bg:#100d33; --bg-2:#1a1850; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --pink:#ff4fa3; --pink-2:#ff86c2; --blue:#38bdff; --blue-2:#7fd8ff; --violet:#8b6bff;
  --ink:#ffffff; --muted:#aab0e0; --ok:#4ee6a2; --navy:#14164a;
  --grad:linear-gradient(135deg,var(--pink),#b45cff 55%,var(--blue));
  --display:Fredoka,"Baloo 2",system-ui,sans-serif; --body:Nunito,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.blobs i:nth-child(1){width:60vw;height:60vw;max-width:420px;max-height:420px;left:-15vw;top:-10vw;background:var(--pink)}
.blobs i:nth-child(2){width:70vw;height:70vw;max-width:480px;max-height:480px;right:-25vw;top:30vh;background:#2a6bff}
.blobs i:nth-child(3){width:50vw;height:50vw;max-width:360px;max-height:360px;left:10vw;bottom:-15vw;background:var(--violet);opacity:.35}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;position:relative;z-index:1}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}

/* HUD */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--bg) 60%,transparent)}
.hud .app{display:flex;align-items:center;gap:10px;padding-block:12px 14px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 6px 20px #ff4fa355}
.who b{display:block;font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.05}
.who small{display:block;font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip .ic{font-size:1rem}
.chip small{color:var(--muted);font-weight:800;font-size:.7rem}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-weight:900;cursor:pointer;flex:none}

main.app{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0}
.sec h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0}
.sec span{font-size:.75rem;font-weight:800;color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* level progress */
.lvl{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lvl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.lvl span{font-size:.75rem;color:var(--muted);font-weight:800}
.meter{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .5s}

/* map */
.map{position:relative;width:100%;aspect-ratio:1/1.12;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px #0007,inset 0 0 0 1px var(--line);
  background:repeating-conic-gradient(#ffe3f0 0 25%,#ffd0e6 0 50%) 0 0/30px 30px}
.map .kfloor{position:absolute;left:0;right:0;top:0;height:34%;background:repeating-linear-gradient(0deg,#bfe3ff 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,#bfe3ff 0 1px,#e3f3ff 1px 20px)}
.map .tag{position:absolute;font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#14164a66}
.map .counter{position:absolute;z-index:3;left:5%;right:22%;top:32%;height:4.5%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet));box-shadow:0 6px 14px #14164a40}
.map .door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24%;height:4%;background:var(--pink);border-radius:12px 12px 0 0;display:grid;place-items:center;font:900 .55rem var(--body);letter-spacing:.14em;color:#fff}
.station{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3}
.station .ic{width:66px;height:66px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:42px;position:relative;box-shadow:0 8px 18px #14164a33,inset 0 -4px 0 var(--c)}
.station .lb{font-weight:900;font-size:.7rem;color:#14164a;background:#ffffffd9;border-radius:999px;padding:2px 8px;white-space:nowrap}
.station .badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--pink);color:#fff;font:900 .7rem var(--body);display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.station.locked .ic{filter:grayscale(1);opacity:.6}
.station.locked .badge{background:#14164a}
.station:active .ic{transform:scale(.93)}
.tbl{position:absolute;transform:translate(-50%,-50%);width:14%;aspect-ratio:1;z-index:1}
.tbl .t{position:absolute;inset:20%;border-radius:50%;background:#fff;box-shadow:0 5px 10px #14164a30}
.tbl .c{position:absolute;width:28%;aspect-ratio:1;border-radius:35%;background:var(--blue)}
.tbl .c.l{left:-4%;top:36%}.tbl .c.r{right:-4%;top:36%}
.tbl .plate{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;z-index:2}
.tbl.empty{border:2px dashed #ff4fa380;border-radius:50%;display:grid;place-items:center;font:900 1.1rem var(--body);color:var(--pink);cursor:pointer;background:#ffffff55;padding:0}
.dec{position:absolute;transform:translate(-50%,-50%);font-size:32px;z-index:2}
.walker{position:absolute;transform:translate(-50%,-85%);font-size:32px;z-index:4;transition:left 1.6s linear,top 1.6s linear;pointer-events:none}
.walker small{position:absolute;right:-18px;top:-6px;font-size:20px;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;box-shadow:0 3px 8px #14164a40}
.mchef{position:absolute;transform:translate(-50%,-62%);z-index:2;transition:left 1.2s ease-in-out,top 1.2s ease-in-out;pointer-events:none}
/* drawn characters */
.ppl{width:34px;height:48px;display:block;overflow:visible;filter:drop-shadow(0 2px 1px #14164a40)}
.mchef .ppl{width:38px;height:54px}
.walk .ppl .bd{animation:hop .3s ease-in-out infinite alternate}
.walk .ppl .l1{animation:stepA .3s ease-in-out infinite alternate;transform-origin:16px 41px}
.walk .ppl .l2{animation:stepB .3s ease-in-out infinite alternate;transform-origin:24px 41px}
@keyframes hop{to{transform:translateY(-1.6px)}}
@keyframes stepA{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes stepB{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.ppl .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.02);filter:brightness(1.15)}}

/* play cards */
.plays{display:flex;flex-direction:column;gap:10px}
.play{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:22px;background:var(--glass);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.play .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 90%,#fff),color-mix(in srgb,var(--c) 60%,#14164a))}
.play b{display:block;font-family:var(--display);font-weight:600;font-size:1.02rem}
.play small{display:block;font-size:.75rem;font-weight:800;color:var(--muted)}
.play .go{font-weight:900;font-size:.85rem;border-radius:999px;padding:10px 16px;background:var(--grad);color:#fff;white-space:nowrap}
.play.locked{opacity:.5}
.play.locked .go{background:rgba(255,255,255,.1)}
.play.done .go{background:rgba(78,230,162,.18);color:var(--ok)}

/* buttons */
.btn{border:0;border-radius:18px;padding:14px 16px;cursor:pointer;font-weight:900;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.1);color:#fff;transition:transform .08s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--grad);box-shadow:0 10px 24px #ff4fa340}
.btn.pink{background:var(--pink)}
.btn.blue{background:var(--blue);color:#06204a}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default;box-shadow:none}
.btn small{font-weight:800;opacity:.85}

/* upgrades */
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--line);cursor:pointer;min-width:0}
.up .ic{grid-row:1/3;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:32px}
.up .tx{min-width:0}
.up b{display:block;font-family:var(--display);font-weight:600;font-size:.92rem;white-space:nowrap}
.up b i{font-style:normal;font-family:var(--body);font-size:.66rem;font-weight:900;color:var(--blue-2)}
.up small{display:block;font-size:.66rem;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .price{grid-column:2;justify-self:start;font-weight:900;font-size:.78rem;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.1);color:var(--muted);white-space:nowrap}
.up.ok{border-color:#ff4fa380;box-shadow:0 0 0 1px #ff4fa340,0 10px 24px #ff4fa325}
.up.ok .price{background:var(--grad);color:#fff}
.up:active{transform:scale(.97)}
.extra{display:flex;gap:10px;flex-wrap:wrap}
.extra .btn{flex:1;font-size:.8rem;padding:12px}
.ad-banner{border:1px dashed var(--line);border-radius:16px;padding:12px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:800}

/* coach */
.coach{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;pointer-events:none}
.coach .app{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.coach .pfp{font-size:40px;line-height:1;flex:none;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{background:#fff;color:var(--navy);border-radius:20px 20px 20px 6px;padding:12px 14px;font-weight:800;font-size:.88rem;line-height:1.35;box-shadow:0 14px 30px #0006;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bubble b{color:#d6247f}
.skip{background:none;border:0;color:#8a8fbf;font:800 .72rem var(--body);cursor:pointer;align-self:flex-end;padding:0}
.spot{position:relative;z-index:5;animation:ring 1.3s infinite;border-radius:22px}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 #ff4fa3cc}50%{box-shadow:0 0 0 10px #ff4fa300}}

/* puzzle sheet */
.stage{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage .blobs i{opacity:.35}
.shead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-block:12px;position:relative;z-index:1}
.shead h3{margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.1}
.shead h3 small{display:block;font-family:var(--body);font-size:.7rem;color:var(--muted);font-weight:800}
.hearts{font-size:.95rem;letter-spacing:1px;white-space:nowrap}
.arena{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:1;padding-bottom:12px}
.prog{display:flex;justify-content:center;gap:6px}
.prog i{width:22px;height:6px;border-radius:999px;background:rgba(255,255,255,.15);transition:background .3s}
.prog i.on{background:var(--grad)}
.gboard{display:grid;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--navy);padding:3px;gap:0;box-shadow:0 20px 50px #0008;touch-action:none}
.gboard.solved{animation:pulse .7s}
.gcell{position:relative;display:grid;place-items:center;cursor:pointer;border:0;padding:0;font-size:inherit;line-height:1;min-width:0;min-height:0;overflow:hidden;contain:strict}
.gcell>span{position:absolute;left:50%;top:50%;translate:-50% -50%}
.gcell .pc{animation:pop .28s ease-out;filter:drop-shadow(0 2px 2px #0003);position:relative;z-index:1}
.gcell .pc.given{animation:none}
.gcell:has(.given)::before{content:"";position:absolute;inset:12%;border-radius:50%;background:#ffffff8c}
.gcell .mk{color:var(--navy);opacity:.45;font-weight:900;font-size:.7em}
.gcell .dt{width:16%;aspect-ratio:1;border-radius:50%;background:var(--navy);opacity:.22}
.gcell.bad{animation:ko .35s}
.gcell.bad::after{content:"";position:absolute;inset:0;background:var(--pink);opacity:.65;animation:fade .6s forwards}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fade{to{opacity:0}}
@keyframes ko{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:440px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.seg button{border:0;border-radius:14px;padding:12px 6px;font-weight:900;font-size:1rem;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.hintbtn{border:0;border-radius:18px;padding:0 16px;background:var(--grad);font-weight:900;cursor:pointer;display:flex;align-items:center;gap:6px}
.hintbtn small{background:#fff3;border-radius:999px;padding:1px 7px;font-size:.72rem}
.tip{margin:0;text-align:center;font-size:.76rem;color:var(--muted);font-weight:800}

/* dialogs & toast */
.overlay{position:fixed;inset:0;background:rgba(8,6,30,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{background:linear-gradient(180deg,#24206a,#17154d);border:1px solid var(--line);border-radius:28px;padding:24px 20px 18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 30px 60px #000a;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45;font-weight:700}
.card p b{color:#fff}
.card ol{text-align:left;margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;line-height:1.4;font-weight:700}
.card .big{font-family:var(--display);font-weight:700;font-size:2.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .emo{font-size:3rem;line-height:1}
.card .kicker{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);font-weight:900}
.card.adv{background:#000}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:var(--navy);font-weight:900;padding:10px 18px;border-radius:999px;z-index:30;font-size:.88rem;max-width:90vw;text-align:center;box-shadow:0 12px 30px #0007}
/* idle layer: city card, missions, station rows, live bars */
.city{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.city .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.city b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.city span{font-size:.75rem;color:var(--muted);font-weight:800}
.city .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.city .btn{padding:11px 10px;font-size:.8rem;border-radius:14px}
.btn.glow{background:linear-gradient(135deg,#ffcf4a,#ff8a3d);color:#3a1600;box-shadow:0 8px 20px #ffb54755}
.mis{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.mrow .e{font-size:22px;text-align:center}
.mrow b{display:block;font-size:.82rem;font-weight:900;line-height:1.2}
.mrow small{display:block;font-size:.66rem;color:var(--muted);font-weight:800}
.mrow .meter{height:6px;margin-top:4px}
.mrow .claim{border:0;border-radius:999px;padding:8px 12px;font-weight:900;font-size:.75rem;cursor:pointer;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.mrow .claim.ok{background:var(--grad);color:#fff;animation:ring 1.3s infinite}
.buyseg{display:flex;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.buyseg button{border:0;background:none;color:var(--muted);font-weight:900;font-size:.72rem;padding:5px 10px;border-radius:999px;cursor:pointer}
.buyseg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.rows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:58px 1fr auto;gap:6px 12px;align-items:center;padding:12px;border-radius:22px;background:var(--glass);border:1px solid var(--line)}
.srow .ic{grid-row:1/3;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:36px;border:0;cursor:pointer;position:relative;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 90%,#fff),color-mix(in srgb,var(--c) 60%,#14164a))}
.srow .ic .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#fff;color:var(--navy);font:900 .62rem var(--body);border-radius:999px;padding:1px 7px;white-space:nowrap}
.srow .tx{min-width:0}
.srow .tx b{font-family:var(--display);font-weight:600;font-size:1rem;display:block;line-height:1.1}
.srow .tx small{display:block;font-size:.7rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tx .rate{color:var(--ok)}
.srow .meter{height:6px;margin:5px 0 2px}
.srow .upb{border:0;border-radius:16px;padding:9px 12px;cursor:pointer;font-weight:900;font-size:.78rem;line-height:1.15;background:rgba(255,255,255,.1);color:var(--muted);text-align:center;min-width:92px}
.srow .upb small{display:block;font-size:.68rem;font-weight:800}
.srow .upb.ok{background:var(--grad);color:#fff;box-shadow:0 8px 18px #ff4fa335}
.srow .chips{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 10px;font-weight:900;font-size:.7rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.chipb.ok{border-color:#4ee6a280;color:var(--ok);background:rgba(78,230,162,.1)}
.chipb.hot{border-color:#ffb547;color:#ffcf4a;background:rgba(255,181,71,.12)}
.chipb.on{border-color:transparent;background:var(--grad);color:#fff}
.srow.locked .ic{filter:grayscale(1);opacity:.55}
.up.done{opacity:.6;cursor:default}
.up.done .price{background:rgba(78,230,162,.18);color:var(--ok)}
/* map additions */
.station .sbar{width:58px;height:7px;border-radius:999px;background:#14164a26;overflow:hidden}
.station .sbar i{display:block;height:100%;width:0;background:var(--c);border-radius:999px}
.station .coin{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:26px;animation:bob .8s infinite;filter:drop-shadow(0 3px 3px #14164a55)}
.station .boost{position:absolute;bottom:-6px;left:-8px;font-size:18px}
.station .price2{font-weight:900;font-size:.62rem;color:#fff;background:#14164acc;border-radius:999px;padding:2px 7px;white-space:nowrap}
.mgr{position:absolute;transform:translate(-50%,-62%);z-index:4;pointer-events:none}
.mgr .ppl{width:30px;height:42px}
.zp{position:absolute;transform:translate(-50%,-50%);z-index:2;background:#ffffffe6;color:var(--navy);font:900 .58rem var(--body);border-radius:999px;padding:3px 7px;white-space:nowrap;box-shadow:0 3px 8px #14164a30}
.vip{pointer-events:auto;cursor:pointer;z-index:6}
.vip small{background:#ffcf4a!important;animation:bob .7s infinite}
.float{position:absolute;transform:translate(-50%,-50%);z-index:7;font:900 .85rem var(--body);color:#14164a;background:#fff;border-radius:999px;padding:2px 8px;pointer-events:none;animation:floatup 1s ease-out forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-260%);opacity:0}}
.rush{position:absolute;top:8px;right:8px;z-index:5;background:var(--grad);color:#fff;font:900 .7rem var(--body);border-radius:999px;padding:4px 10px;box-shadow:0 6px 14px #14164a40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("ce6_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ce6_"+k,JSON.stringify(v))}catch(e){}},clear(){try{Object.keys(localStorage).filter(k=>k.startsWith("ce6_")).forEach(k=>localStorage.removeItem(k))}catch(e){}}};

// ---- stations: each one cooks on a loop and earns per cycle ----
const ST=[
  {k:"fry",e:"🍗",piece:"🍗",word:"tender",c:"#ffb547",name:"Friteuse",lbl:"Friteuse",b:5,g:1.13,inc:1,cy:1.2,m:250,boss:"Momo",sizes:[5,5,5,5,6,6]},
  {k:"sauce",e:"🥫",piece:"🥫",word:"pot de sauce",c:"#ff6b8f",name:"Bar à sauces",lbl:"Sauces",b:200,g:1.14,inc:9,cy:3,m:4000,boss:"Inès",sizes:[5,6,6,6,7]},
  {k:"catch",e:"📦",piece:"📦",word:"colis",c:"#5cc8ff",name:"Livraisons",lbl:"Livraisons",b:6000,g:1.15,inc:110,cy:6,m:90000,boss:"Yanis",sizes:[6,6,7,7,8]},
  {k:"memo",e:"🧾",piece:"🍔",word:"burger",c:"#a98bff",name:"Caisse",lbl:"Caisse",b:150000,g:1.16,inc:1500,cy:12,m:1.5e6,boss:"Lina",sizes:[6,7,7,8,8]},
];
const SK={};ST.forEach(s=>SK[s.k]=s);
const DAILY={k:"daily",e:"🗓️",piece:"🍔",word:"burger",c:"#a98bff",name:"Défi du jour",daily:true};
const MS=[10,25,50,100,150,200,300,400,500];
const ZONES=[
  {k:"terr",e:"⛱️",name:"Terrasse",cost:25000,s:"Tous les gains x1,5",f:()=>1.5},
  {k:"drive",e:"🚗",name:"Drive",cost:6e5,s:"Livraisons et Caisse x3",f:k=>k==="catch"||k==="memo"?3:1},
  {k:"etage",e:"🛗",name:"Salle à l'étage",cost:8e6,s:"Tous les gains x2",f:()=>2},
  {k:"truck",e:"🚚",name:"Food truck",cost:2e8,s:"Tous les gains x3",f:()=>3},
];
const NIGHT=[2,4,8,12],NIGHT_COST=[2000,80000,3e6];
const CITIES=["Lille","Lyon","Marseille","Toulouse","Bordeaux","Nantes","Strasbourg","Nice","Paris"];
const RANKS=["Petit stand","Snack de quartier","Resto crousty","Resto star","Chaîne régionale","Empire national","Légende du crousty"],RANK_AT=[0,25,60,110,180,270,400];
const PRESTIGE_AT=1e6;

function freshSt(){const o={};ST.forEach((s,i)=>o[s.k]={l:i?0:1,m:0,t:0,r:0});return o}
function fresh(){return{v:6,money:0,run:0,life:0,stars:0,city:0,st:freshSt(),zones:[],deco:0,night:0,boost:{},rush:0,gl:{fry:0,sauce:0,catch:0,memo:0},hints:3,daily:0,plays:0,taps:0,tut:0,noAds:false,lastAd:0,last:Date.now(),mis:[],misN:0,login:{day:0,streak:0},buy:1}}
let G=Object.assign(fresh(),store.get("save",{}));G.st=Object.assign(freshSt(),G.st);G.gl=Object.assign(fresh().gl,G.gl);
function save(){G.last=Date.now();store.set("save",G)}
const SUF=["","k","M","Md","T","Qa","Qi"];
function fmt(n){if(n<1000)return(n<10&&n%1?n.toFixed(1).replace(".",","):Math.floor(n))+" €";let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0).replace(".",",")+" "+SUF[i]+" €"}
const fmtT=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function dayKey(off=0){const d=new Date(Date.now()+off*864e5);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
const todayKey=()=>dayKey(0);
const dailyDone=()=>G.daily===todayKey();

// ---- economy ----
const msCount=l=>MS.filter(x=>l>=x).length;
const nextMS=l=>MS.find(x=>x>l);
const rushOn=()=>G.rush>Date.now();
const boostOn=k=>(G.boost[k]||0)>Date.now();
function baseMult(k){let m=(1+.1*G.stars)*(1+.1*G.deco);ZONES.forEach(z=>{if(G.zones.includes(z.k))m*=z.f(k)});return m}
function perCycle(k,live=true){const s=G.st[k],d=SK[k];if(!s.l)return 0;let v=d.inc*s.l*Math.pow(2,msCount(s.l))*baseMult(k);if(live){if(rushOn())v*=2;if(boostOn(k))v*=2}return v}
const rate=(k,live)=>perCycle(k,live)/SK[k].cy;
const totalRate=(live=true)=>ST.reduce((a,s)=>a+rate(s.k,live),0);
const offlineRate=()=>ST.reduce((a,s)=>a+(G.st[s.k].m?rate(s.k,false):0),0);
function cost(k,n){const s=G.st[k],d=SK[k];if(!s.l)return d.b;return d.b*Math.pow(d.g,s.l)*(Math.pow(d.g,n)-1)/(d.g-1)}
function maxBuy(k){const s=G.st[k],d=SK[k];if(!s.l)return G.money>=d.b?1:0;const c0=d.b*Math.pow(d.g,s.l);return Math.max(0,Math.floor(Math.log(G.money*(d.g-1)/c0+1)/Math.log(d.g)))}
function buyN(k){if(!G.st[k].l)return 1;return G.buy?G.buy:Math.max(1,maxBuy(k))}
function totalLvl(){return ST.reduce((a,s)=>a+G.st[s.k].l,0)}
function rankIdx(){let i=0;RANK_AT.forEach((t,j)=>{if(totalLvl()>=t)i=j});return i}
const offlineCap=()=>NIGHT[G.night];
const decoCost=()=>Math.round(300*Math.pow(3,G.deco));
const starsTotal=()=>Math.floor(10*Math.sqrt(G.life/PRESTIGE_AT));
const starsClaim=()=>Math.max(0,starsTotal()-G.stars);
const cityName=()=>CITIES[G.city%CITIES.length]+(G.city>=CITIES.length?" "+(Math.floor(G.city/CITIES.length)+1):"");
function earn(v){G.money+=v;G.run+=v;G.life+=v}

function buy(k){const s=G.st[k],n=buyN(k),c=cost(k,n),d=SK[k];if(G.money<c){toast("Il te manque "+fmt(c-G.money));return}
  G.money-=c;const before=msCount(s.l),opening=!s.l;s.l+=n;save();
  if(opening)toast("🎉 "+d.name+" ouvert !");else if(msCount(s.l)>before)toast("🚀 Palier "+MS[msCount(s.l)-1]+" : "+d.name+" x2 !");
  pulse();render()}
function hire(k){const d=SK[k],s=G.st[k];if(s.m||!s.l)return;if(G.money<d.m){toast("Il te manque "+fmt(d.m-G.money)+" pour embaucher "+d.boss);return}
  G.money-=d.m;s.m=1;if(s.r){earn(perCycle(k));s.r=0;s.t=0}save();toast("👤 "+d.boss+" gère "+d.name+", même hors ligne");render()}
function collect(k,el){const s=G.st[k];if(!s.r)return;const v=perCycle(k);earn(v);s.r=0;s.t=0;G.taps++;floaty("+"+fmt(v),el);if(G.taps<=3)coach()}
function pulse(){const m=$("map");m.classList.remove("pulse");void m.offsetWidth;m.classList.add("pulse")}

// ---- missions ----
const MIS_E={lvl:"⬆️",open:"🔓",mgr:"👤",earn:"💰",grid:"🧩",zone:"🏗️"};
function niceNum(n){const p=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.ceil(n/p)*p}
function newMission(){const opts=[],have=G.mis.map(m=>m.t+(m.k||""));const U=ST.filter(s=>G.st[s.k].l);
  U.forEach(s=>{const l=G.st[s.k].l,nm=nextMS(l);opts.push({t:"lvl",k:s.k,n:nm&&nm-l<=20?nm:l+10})});
  const lock=ST.find(s=>!G.st[s.k].l);if(lock)opts.push({t:"open",k:lock.k});
  const nm=U.find(s=>!G.st[s.k].m);if(nm)opts.push({t:"mgr",k:nm.k},{t:"mgr",k:nm.k});
  opts.push({t:"earn",s:G.run,n:niceNum(Math.max(300,totalRate(false)*240))});
  opts.push({t:"grid",s:G.plays,n:G.plays<3?1:2});
  const z=ZONES.find(z=>!G.zones.includes(z.k));if(z&&z.cost<G.run*4+5000)opts.push({t:"zone",k:z.k});
  const pool=opts.filter(o=>!have.includes(o.t+(o.k||"")));const m=pool[Math.floor(Math.random()*pool.length)]||opts[0];
  G.misN++;m.rw=niceNum(Math.max(100,totalRate(false)*120));if(G.misN%3===0)m.h=1;return m}
function misProg(m){const s=G.st[m.k];switch(m.t){
  case"lvl":return[s.l,m.n];case"open":return[s.l?1:0,1];case"mgr":return[s.m,1];
  case"earn":return[G.run-m.s,m.n];case"grid":return[G.plays-m.s,m.n];case"zone":return[G.zones.includes(m.k)?1:0,1]}}
function misText(m){const d=SK[m.k];switch(m.t){
  case"lvl":return d.name+" niveau "+m.n;case"open":return"Ouvrir : "+d.name;case"mgr":return"Embaucher "+d.boss+" ("+d.name+")";
  case"earn":return"Encaisser "+fmt(m.n);case"grid":return"Réussir "+m.n+" grille"+(m.n>1?"s":"");case"zone":return"Construire : "+ZONES.find(z=>z.k===m.k).name}}
function fillMissions(){while(G.mis.length<3)G.mis.push(newMission())}
function claim(i){const m=G.mis[i],[a,b]=misProg(m);if(a<b)return;earn(m.rw);if(m.h)G.hints++;G.mis.splice(i,1);fillMissions();save();toast("🎯 +"+fmt(m.rw)+(m.h?" · +1 💡":""));render()}

// ---- render ----
function render(){
  fillMissions();
  const ri=rankIdx();$("rankLine").textContent=RANKS[ri]+" · "+cityName();
  $("cityName").textContent="🏙️ "+cityName()+" · "+RANKS[ri];
  $("starTxt").textContent="⭐ "+G.stars+" (+"+G.stars*10+" %)";
  drawMap();drawMissions();drawRows();drawPlays();drawUps();
  [...$("buyseg").children].forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===G.buy));
  $("banner").hidden=G.noAds;
  live();coach();
}
function drawMissions(){const w=$("mis");w.innerHTML="";G.mis.forEach((m,i)=>{const[a,b]=misProg(m),ok=a>=b,r=document.createElement("div");r.className="mrow";
  r.innerHTML=`<span class="e">${MIS_E[m.t]}</span><div><b>${misText(m)}</b><small>Récompense : ${fmt(m.rw)}${m.h?" + 1 💡":""}</small><div class="meter"><i id="mb${i}" style="width:${Math.min(100,a/b*100)}%"></i></div></div><button class="claim${ok?" ok":""}" id="mc${i}">${ok?"Récupérer":Math.min(a,b).toLocaleString("fr-FR",{maximumFractionDigits:0})+"/"+(m.t==="earn"?fmt(b):b)}</button>`;
  r.querySelector("button").onclick=()=>claim(i);w.appendChild(r)});
  $("misHint").textContent=G.hints+" 💡 en stock"}
function drawRows(){const w=$("rows");w.innerHTML="";
  ST.forEach(d=>{const s=G.st[d.k],r=document.createElement("div");r.className="srow"+(s.l?"":" locked");r.style.setProperty("--c",d.c);r.id="r_"+d.k;
    if(!s.l){r.innerHTML=`<button class="ic">${d.e}<span class="lv">🔒</span></button><div class="tx"><b>${d.name}</b><small>${fmt(d.inc/d.cy*baseMult(d.k))}/s au niveau 1 · grille ${d.word}s</small></div><button class="upb" id="up_${d.k}">Ouvrir<small>${fmt(d.b)}</small></button>`;
      r.querySelector(".upb").onclick=()=>buy(d.k);r.querySelector(".ic").onclick=()=>buy(d.k)}
    else{const nm=nextMS(s.l),pm=MS.filter(x=>x<=s.l).pop()||0;
      r.innerHTML=`<button class="ic" aria-label="Encaisser">${d.e}<span class="lv">Niv. ${s.l}</span></button><div class="tx"><b>${d.name}</b><small><span class="rate" id="rt_${d.k}"></span> · ${nm?"x2 au niv. "+nm:"paliers max"}</small><div class="meter"><i style="width:${nm?(s.l-pm)/(nm-pm)*100:100}%"></i></div></div><button class="upb" id="up_${d.k}"></button>
        <div class="chips">${s.m?`<span class="chipb ok">👤 ${d.boss} encaisse tout seul</span>`:`<button class="chipb" id="mg_${d.k}">👤 Embaucher ${d.boss} · ${fmt(d.m)}</button>`}<button class="chipb hot" id="tb_${d.k}">🧩 Grille · turbo x2</button></div>`;
      r.querySelector(".upb").onclick=()=>buy(d.k);r.querySelector(".ic").onclick=e=>{if(G.st[d.k].r)collect(d.k,$("m_"+d.k));else toast(s.m?d.boss+" s'en occupe":"Attends le 💰 sur la carte")};
      if(!s.m)r.querySelector("#mg_"+d.k).onclick=()=>hire(d.k);r.querySelector("#tb_"+d.k).onclick=()=>openGame(d)}
    w.appendChild(r)})}
function drawPlays(){const w=$("plays");w.innerHTML="";const g=DAILY,done=dailyDone(),b=document.createElement("button");b.className="play"+(done?" done":"");b.id="g_daily";b.style.setProperty("--c",g.c);
  b.innerHTML=`<div class="ic">${g.e}</div><div><b>${g.name}</b><small>${done?"Réussi aujourd'hui · reviens demain":"Grille 7x7 · gros gain + Rush x2 10 min"}</small></div><span class="go">${done?"✓":"Jouer"}</span>`;
  b.onclick=()=>openGame(g);w.appendChild(b)}
function drawUps(){const w=$("ups");w.innerHTML="";
  const tile=(id,e,name,lv,sub,price,done,fn)=>{const r=document.createElement("button");r.className="up"+(done?" done":"");r.id=id;r.dataset.p=done?"":price;
    r.innerHTML=`<span class="ic">${e}</span><span class="tx"><b>${name} ${lv?`<i>${lv}</i>`:""}</b><small>${sub}</small></span><span class="price">${done?"✓ Ouvert":fmt(price)}</span>`;
    r.onclick=()=>{if(done)return;if(G.money<price){toast("Il te manque "+fmt(price-G.money));return}G.money-=price;fn();save();pulse();render()};w.appendChild(r)};
  ZONES.forEach(z=>tile("z_"+z.k,z.e,z.name,"",z.s,z.cost,G.zones.includes(z.k),()=>{G.zones.push(z.k);toast(z.e+" "+z.name+" ouvert : "+z.s)}));
  tile("u_deco","🪴","Déco","Niv. "+G.deco,"+10 % sur tout",decoCost(),false,()=>{G.deco++;toast("🪴 Déco niveau "+G.deco)});
  const nmax=G.night>=NIGHT_COST.length;
  tile("u_night","🌙","Équipe de nuit","",nmax?"Hors ligne "+offlineCap()+" h":"Hors ligne "+offlineCap()+" h → "+NIGHT[G.night+1]+" h",nmax?0:NIGHT_COST[G.night],nmax,()=>{G.night++;toast("🌙 Gains hors ligne jusqu'à "+offlineCap()+" h")});
  $("upHint").textContent="Hors ligne : "+offlineCap()+" h max"}

// live numbers, bars and buttons (10x per second)
function live(){
  $("money").textContent=fmt(G.money);$("rateTop").textContent=fmt(totalRate())+"/s";
  ST.forEach(d=>{const s=G.st[d.k],up=$("up_"+d.k);
    const bar=$("sb_"+d.k);if(bar)bar.style.width=(s.l?(d.cy<.35&&s.m?100:Math.min(100,s.t/d.cy*100)):0)+"%";
    const coin=$("cn_"+d.k);if(coin)coin.hidden=!s.r;
    const bo=$("bo_"+d.k);if(bo)bo.hidden=!boostOn(d.k);
    if(!up)return;
    if(s.l){const n=buyN(d.k),c=cost(d.k,n);up.innerHTML="Améliorer"+(n>1?" x"+n:"")+"<small>"+fmt(c)+"</small>";up.classList.toggle("ok",G.money>=c);
      $("rt_"+d.k).textContent=fmt(rate(d.k))+"/s"+(boostOn(d.k)?" ⚡":"");
      const mg=$("mg_"+d.k);if(mg)mg.classList.toggle("on",G.money>=d.m);
      const tb=$("tb_"+d.k);const bl=((G.boost[d.k]||0)-Date.now())/1000;tb.textContent=bl>0?"⚡ Turbo x2 · "+fmtT(bl):"🧩 Grille · turbo x2"}
    else up.classList.toggle("ok",G.money>=d.b)});
  document.querySelectorAll(".up").forEach(b=>b.classList.toggle("ok",!!b.dataset.p&&G.money>=+b.dataset.p));
  G.mis.forEach((m,i)=>{const[a,b]=misProg(m),btn=$("mc"+i),bar=$("mb"+i);if(!btn)return;if(bar)bar.style.width=Math.min(100,a/b*100)+"%";
    if(a>=b&&!btn.classList.contains("ok")){btn.classList.add("ok");btn.textContent="Récupérer"}});
  const rl=(G.rush-Date.now())/1000;$("rushTag").hidden=rl<=0;$("rushTag").textContent="⚡ Rush x2 · "+fmtT(Math.max(0,rl));
  $("rushBtn").textContent=rl>0?"⚡ Rush x2 · "+fmtT(rl):"▶ Rush x2 · 4 min";
  const sc=starsClaim(),can=G.run>=PRESTIGE_AT&&sc>0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function perm(n,r){const p=[],used=new Array(n).fill(false);
  function bt(i){if(i===n)return true;for(const c of shuffle([...Array(n).keys()],r)){if(used[c])continue;if(i>0&&Math.abs(p[i-1]-c)<=1)continue;used[c]=true;p[i]=c;if(bt(i+1))return true;used[c]=false}return false}
  bt(0);return p}
function grow(n,p,r){const g=Array.from({length:n},()=>new Array(n).fill(-1));
  for(let i=0;i<n;i++)g[i][p[i]]=i;let left=n*n-n;
  while(left>0){const k=Math.floor(r()*n);const cells=[];
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(g[y][x]===k)for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<n&&xx>=0&&xx<n&&g[yy][xx]===-1)cells.push([yy,xx])}
    if(!cells.length)continue;const[yy,xx]=cells[Math.floor(r()*cells.length)];g[yy][xx]=k;left--}
  return g}
// returns up to `limit` solutions
function solve(n,g,limit){const out=[];const uc=new Array(n).fill(false),ur=new Array(n).fill(false),p=[];
  function bt(i){if(out.length>=limit)return;if(i===n){out.push(p.slice());return}for(let x=0;x<n;x++){if(uc[x])continue;if(i>0&&Math.abs(p[i-1]-x)<=1)continue;const k=g[i][x];if(ur[k])continue;uc[x]=ur[k]=true;p[i]=x;bt(i+1);uc[x]=ur[k]=false}}
  bt(0);return out}
function connected(n,g,k){let start=null,total=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(g[y][x]===k){total++;if(!start)start=[y,x]}
  if(!start)return false;const seen=new Set([start[0]*n+start[1]]),st=[start];
  while(st.length){const[y,x]=st.pop();for(const[dy,dx]of D4){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<n&&xx>=0&&xx<n&&g[yy][xx]===k&&!seen.has(yy*n+xx)){seen.add(yy*n+xx);st.push([yy,xx])}}}
  return seen.size===total}
function makePuzzle(n,seed){const r=mulberry32(seed);
  for(let t=0;t<200;t++){const p=perm(n,r);const g=grow(n,p,r);
    for(let fix=0;fix<300;fix++){const sols=solve(n,g,2);if(sols.length===1)return{n,regions:g,sol:p};
      const alt=sols.find(s=>s.some((x,i)=>x!==p[i]));
      const rows=shuffle([...Array(n).keys()].filter(i=>alt[i]!==p[i]),r);let done=false;
      for(const i of rows){const x=alt[i],k=g[i][x];if(x===p[i])continue;
        const nb=shuffle(D4.map(([dy,dx])=>[i+dy,x+dx]).filter(([y,xx])=>y>=0&&y<n&&xx>=0&&xx<n&&g[y][xx]!==k),r);
        for(const[y,xx]of nb){const k2=g[y][xx];g[i][x]=k2;if(connected(n,g,k)){done=true;break}g[i][x]=k}
        if(done)break}
      if(!done)break}}
  return null}

    for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++){if(yy===y&&xx===x)continue;if(yy===y||xx===x||P.regions[yy][xx]===k||(Math.abs(yy-y)<=1&&Math.abs(xx-x)<=1))b.add(yy*n+xx)}}return b}

  (function build(){const bd=$("gb");for(let y=0;y<n;y++)for(let x=0;x<n;x++){const id=y*n+x,k=P.regions[y][x],c=document.createElement("button");c.className="gcell";c.dataset.id=id;c.style.background=REG[k];
    const e=(yy,xx)=>yy<0||yy>=n||xx<0||xx>=n||P.regions[yy][xx]!==k,w=v=>v?"2.5px solid #14164a":"1px solid #14164a1f";
    c.style.borderTop=w(e(y-1,x));c.style.borderLeft=w(e(y,x-1));c.style.borderRight=w(e(y,x+1));c.style.borderBottom=w(e(y+1,x));c.setAttribute("aria-label","Case "+(y+1)+"-"+(x+1));bd.appendChild(c);cells.push(c)}})();
  function draw(){const bl=blocked();cells.forEach((c,id)=>{c.innerHTML=placed.has(id)?`<span class="pc${given.has(id)?" given":""}">${g.piece}</span>`:marks.has(id)?'<span class="mk">✕</span>':bl.has(id)?'<span class="dt"></span>':""});
    $("hearts").textContent="❤️".repeat(lives)+"🤍".repeat(3-lives);$("hc").textContent=G.hints>0?G.hints:"▶";
    [...$("gp").children].forEach((i,k)=>i.classList.toggle("on",k<placed.size))}
  function put(id){const y=Math.floor(id/n),x=id%n;
    if(P.sol[y]===x){placed.add(id);marks.delete(id);try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}draw();if(placed.size===n)win()}
    else{lives--;mistakes++;try{navigator.vibrate&&navigator.vibrate([40,40,40])}catch(e){}draw();cells[id].classList.remove("bad");void cells[id].offsetWidth;cells[id].classList.add("bad");if(lives<=0)setTimeout(lose,450)}}
  // tap to place / mark; in mark mode, drag across cells to mark many
  let dragging=false,dragVal=true;const bd=$("gb");
  const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest(".gcell")};
  bd.addEventListener("pointerdown",e=>{const c=cellAt(e);if(!c||over)return;const id=+c.dataset.id;if(placed.has(id))return;
    if(tool==="put"){put(id);return}dragging=true;dragVal=!marks.has(id);dragVal?marks.add(id):marks.delete(id);draw()});
  bd.addEventListener("pointermove",e=>{if(!dragging)return;const c=cellAt(e);if(!c)return;const id=+c.dataset.id;if(placed.has(id))return;if(dragVal!==marks.has(id)){dragVal?marks.add(id):marks.delete(id);draw()}});
  const stop=()=>dragging=false;window.addEventListener("pointerup",stop);
  const setTool=t=>{tool=t;$("tPut").setAttribute("aria-pressed",t==="put");$("tMark").setAttribute("aria-pressed",t==="mark")};
  $("tPut").onclick=()=>setTool("put");$("tMark").onclick=()=>setTool("mark");
  $("tHint").onclick=()=>{if(over)return;const give=()=>{const free=[...Array(n).keys()].filter(y=>!placed.has(y*n+P.sol[y]));if(!free.length)return;const y=free[Math.floor(Math.random()*free.length)];put(y*n+P.sol[y])};
    if(G.hints>0){G.hints--;save();give()}else rewarded("Regarde une courte vidéo pour gagner 1 indice.",give)};
  function win(){over=true;const secs=Math.round((Date.now()-t0)/1000),pts=BASE[n]*(mistakes?1:1.5)*(g.daily?3:1);
    if(g.daily)G.daily=todayKey();else{G.gl[g.k]++;if(G.gl[g.k]%3===0){G.hints++;toast("💡 +1 indice offert")}}save();
    bd.classList.add("solved");if(!mistakes)toast("Sans faute ! Gains x1,5 · "+Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"));setTimeout(()=>done(Math.round(pts)),900)}
  function lose(){over=true;show(`<div class="emo">💔</div><h2>Plus de vies</h2><p>Trois erreurs sur cette grille.</p><button class="btn pink" id="rv">▶ Continuer avec 1 vie</button><button class="btn ghost" id="ab">Abandonner</button>`);
    $("rv").onclick=()=>{hide();rewarded("Regarde une courte vidéo pour récupérer 1 vie.",()=>{lives=1;over=false;draw()},()=>done(0))};$("ab").onclick=()=>{hide();done(0)}}
  draw();cleanup=()=>window.removeEventListener("pointerup",stop);
}

// ---- coach (first minutes) ----
const TUT=[
  {el:()=>$("m_fry"),txt:"Salut, moi c'est <b>Chef Poulette</b> ! Quand le 💰 apparaît sur la <b>Friteuse</b>, tape dessus pour encaisser.",done:()=>G.taps>=3||G.st.fry.m},
  {el:()=>$("up_fry"),txt:"Bien joué ! <b>Améliore la Friteuse</b> : chaque niveau rapporte plus, et les paliers 10, 25, 50… doublent tout.",done:()=>G.st.fry.l>=5},
  {el:()=>$("mg_fry"),txt:"Garde 250 € pour embaucher <b>Momo</b> : il encaisse à ta place, même quand le jeu est fermé.",done:()=>G.st.fry.m},
  {el:()=>$("tb_fry"),txt:"Joue une <b>grille</b> à la Friteuse : réussie, elle rapporte de l'argent et un <b>turbo x2</b> pendant 3 min.",done:()=>G.plays>=1},
  {el:()=>$("mis"),txt:"Remplis les <b>Objectifs</b>, fais le <b>Défi du jour</b>, et à 1 M € tu pourras ouvrir un resto dans une autre ville avec des ⭐ bonus 🔥",ok:true},
];
let spotEl=null;
function coach(){while(G.tut<TUT.length&&TUT[G.tut].done&&TUT[G.tut].done()){G.tut++;save()}
  if(spotEl){spotEl.classList.remove("spot");spotEl=null}
  if(G.tut>=TUT.length){$("coach").hidden=true;return}
  const s=TUT[G.tut],el=s.el();$("coach").hidden=false;$("coachText").innerHTML=s.txt;$("coachSkip").textContent=s.ok?"Compris !":"Passer le tuto";if(el){el.classList.add("spot");spotEl=el}}
$("coachSkip").onclick=()=>{G.tut=TUT[G.tut]&&TUT[G.tut].ok?G.tut+1:TUT.length;save();coach()};

// ---- ads (simulated; AdMob in the Android app) ----
function rewarded(msg,ok,onCancel){if(G.noAds){ok();return}
  show(`<div class="kicker">Vidéo récompensée</div><div class="emo">🎬</div><h2>Bonus vidéo</h2><p>${msg}</p><button class="btn pink" id="w">▶ Regarder (simulée)</button><button class="btn ghost" id="x">Non merci</button>`);
  $("x").onclick=()=>{hide();onCancel&&onCancel()};$("w").onclick=()=>fakeAd(5,"Vidéo récompensée (simulée)",()=>{hide();ok()})}
function maybeInterstitial(then){if(G.noAds||G.plays%3!==0||Date.now()-G.lastAd<5*60*1000){then();return}G.lastAd=Date.now();fakeAd(3,"Pub plein écran (simulée) · 1 toutes les 5 min max",()=>{hide();then()})}
function fakeAd(sec,label,done){const c=$("card");c.classList.add("adv");$("overlay").hidden=false;let n=sec;
  const d=()=>c.innerHTML=`<div class="kicker">${label}</div><div class="big">${n}</div><p>Ici s'affichera une vraie pub AdMob.</p>`;d();
  const it=setInterval(()=>{n--;if(n<=0){clearInterval(it);c.classList.remove("adv");done()}else d()},1000)}
$("noAdsBtn").onclick=()=>{show(`<div class="emo">🚫</div><h2>Jouer sans pub</h2><p>Dans l'appli, ce sera un achat unique (environ 2,99 €). Les bonus vidéo deviennent gratuits et instantanés.</p><button class="btn primary" id="b">Simuler l'achat</button><button class="btn ghost" id="x">Plus tard</button>`);
  $("b").onclick=()=>{G.noAds=true;save();hide();render();toast("Pubs retirées")};$("x").onclick=hide};

// ---- rush video ----
$("rushBtn").onclick=()=>{if(rushOn()){toast("Rush déjà actif");return}rewarded("Regarde une courte vidéo : tous tes postes rapportent x2 pendant 4 minutes.",()=>{G.rush=Date.now()+4*60000;save();render();toast("⚡ Rush x2 lancé !")})};

// ---- new restaurant in another city (prestige) ----
$("preBtn").onclick=()=>{const sc=starsClaim();if(G.run<PRESTIGE_AT||!sc)return;const next=CITIES[(G.city+1)%CITIES.length];
  show(`<div class="kicker">Nouveau resto</div><div class="emo">🏙️</div><h2>Ouvrir à ${next} ?</h2><p>Tu repars de zéro dans une nouvelle ville (argent, postes, managers, agrandissements), mais tu gagnes <b>+${sc} ⭐</b>. Chaque étoile donne <b>+10 % sur tous les gains, pour toujours</b>.</p><p>Tu gardes : étoiles, indices, progression des grilles, achat sans pub.</p><div class="big">⭐ ${G.stars} → ${G.stars+sc}</div><button class="btn primary" id="ok">Ouvrir à ${next}</button><button class="btn ghost" id="x">Pas encore</button>`);
  $("x").onclick=hide;$("ok").onclick=()=>{G.stars+=sc;G.city++;Object.assign(G,{money:0,run:0,st:freshSt(),zones:[],deco:0,night:0,boost:{},mis:[]});save();hide();render();pulse();toast("🏙️ Bienvenue à "+cityName()+" ! +"+sc+" ⭐")}};

// ---- offline earnings, then daily login reward ----
function offline(away,then){const mins=Math.min(away/60000,offlineCap()*60),r=offlineRate();
  if(away<60000||!r){then&&then();return}const v=r*mins*60;
  show(`<div class="emo">🍽️</div><h2>Pendant ton absence</h2><p>Tes managers ont fait tourner le resto pendant ${mins>=60?Math.floor(mins/60)+" h "+String(Math.round(mins%60)).padStart(2,"0"):Math.round(mins)+" min"}${away/60000>mins?" (max "+offlineCap()+" h : agrandis l'Équipe de nuit)":""}.</p><div class="big">+${fmt(v)}</div><button class="btn pink" id="x2">▶ Doubler · +${fmt(v*2)}</button><button class="btn ghost" id="take">Récupérer</button>`);
  const pay=x=>{earn(x);save();render();then&&then()};$("take").onclick=()=>{hide();pay(v)};$("x2").onclick=()=>{hide();rewarded("Regarde une courte vidéo pour doubler tes gains hors ligne.",()=>pay(v*2),()=>pay(v))}}
function login(){const t=todayKey();if(G.login.day===t)return;if(!G.login.day){G.login={day:t,streak:1};save();return}const streak=G.login.day===dayKey(-1)?G.login.streak%7+1:1;G.login={day:t,streak};
  const v=niceNum(Math.max(50*streak,totalRate(false)*60*streak)),h=streak===7?3:0;earn(v);G.hints+=h;save();
  const days=[1,2,3,4,5,6,7].map(d=>`<span style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;font-weight:900;font-size:.8rem;background:${d<=streak?"var(--grad)":"rgba(255,255,255,.08)"}">${d===7?"🎁":d}</span>`).join(" ");
  show(`<div class="kicker">Cadeau du jour · jour ${streak}/7</div><div class="emo">🎁</div><h2>Bon retour, chef !</h2><div>${days}</div><div class="big">+${fmt(v)}</div>${h?"<p><b>+3 💡 indices</b> pour ta semaine complète !</p>":"<p>Reviens demain pour un plus gros cadeau.</p>"}<button class="btn primary" id="x">Merci !</button>`);
  $("x").onclick=()=>{hide();render()}}

  <li>Chaque <b>poste</b> cuisine en boucle. Tape sur le 💰 pour encaisser, ou embauche un <b>manager</b> qui encaisse à ta place, même hors ligne.</li>

  <li>À 1 M € gagnés, ouvre un <b>nouveau resto</b> dans une autre ville : tu repars de zéro avec des ⭐ qui boostent tout pour toujours.</li></ol>
  <button class="btn primary" id="x">Compris</button><button class="btn ghost" id="replay">Revoir le tuto</button>`);$("x").onclick=hide;$("replay").onclick=()=>{G.tut=0;save();hide();render()}};
$("resetBtn").onclick=()=>{show(`<h2>Recommencer à zéro ?</h2><p>Ton resto, ton argent, tes étoiles et tes grilles seront effacés.</p><button class="btn pink" id="ok">Tout effacer</button><button class="btn ghost" id="x">Annuler</button>`);$("x").onclick=hide;$("ok").onclick=()=>{store.clear();G=fresh();save();hide();render()}};

function hide(){$("overlay").hidden=true}

render();offline(Date.now()-(G.last||Date.now()),login);
